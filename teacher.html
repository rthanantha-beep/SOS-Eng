<script>
const SHEET_ID = "1VUkd2bwpxv1_ivIo6AyD2HaoduiAOYR0Eyn4agKUOVw";
const SHEET_NAME = "Answers"; 

function doPost(e) {
  // บังคับให้รับค่า CORS Option Preflight ในกรณีที่มีการส่ง Request แบบอื่นหลุดมา
  if (typeof e === 'undefined') {
    return ContentService.createTextOutput(JSON.stringify({status: 'error'})).setMimeType(ContentService.MimeType.JSON);
  }

  try {
    const requestData = JSON.parse(e.postData.contents);
    if (requestData.action === "submit") return recordAnswer(requestData);
    if (requestData.action === "getStats") return getDashboardStats();
  } catch (error) {
    return ContentService.createTextOutput(JSON.stringify({ status: "error", message: error.toString() }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

function recordAnswer(data) {
  // เปลี่ยนมาใช้ openById จะหากันเจอ 100% ไม่ว่าสคริปต์จะอยู่ที่ไหน
  const sheet = SpreadsheetApp.openById(SHEET_ID).getSheetByName(SHEET_NAME);
  
  if (!sheet) {
    return ContentService.createTextOutput(JSON.stringify({ status: "error", message: "หาชื่อแท็บ Answers ไม่เจอ" }))
      .setMimeType(ContentService.MimeType.JSON);
  }

  sheet.appendRow([new Date(), data.studentId, data.questionNo, data.answer, data.difficulty]);
  
  return ContentService.createTextOutput(JSON.stringify({ status: "success" }))
    .setMimeType(ContentService.MimeType.JSON);
}

function getDashboardStats() {
  const sheet = SpreadsheetApp.openById(SHEET_ID).getSheetByName(SHEET_NAME);
  
  if (!sheet) {
    return ContentService.createTextOutput(JSON.stringify({ status: "error", message: "หาชื่อแท็บ Answers ไม่เจอ" }))
      .setMimeType(ContentService.MimeType.JSON);
  }

  const data = sheet.getDataRange().getValues();
  data.shift(); // ตัดแถว Header ทิ้ง
  
  const stats = {};
  
  data.forEach(row => {
    const qNo = row[2];
    const ans = row[3];
    const diff = Number(row[4]) || 0;
    
    // ถ้าแถวไหนไม่มีเลขข้อ ให้ข้ามไป
    if (!qNo) return;
    
    if (!stats[qNo]) stats[qNo] = { total: 0, A: 0, B: 0, C: 0, D: 0, totalDiff: 0, maxDiffCount: 0 };
    
    if (stats[qNo][ans] !== undefined) {
      stats[qNo][ans]++;
      stats[qNo].total++;
      stats[qNo].totalDiff += diff;
      if (diff >= 4) stats[qNo].maxDiffCount++; // นับคนที่โหวต 4-5 กะโหลก
    }
  });

  const result = {};
  for (const q in stats) {
    const avgDiff = stats[q].total > 0 ? (stats[q].totalDiff / stats[q].total).toFixed(1) : 0;
    const skullIcon = "💀".repeat(Math.round(avgDiff)) || "👶"; 
    
    result[q] = {
      total: stats[q].total,
      A_pct: ((stats[q].A / stats[q].total) * 100).toFixed(1),
      B_pct: ((stats[q].B / stats[q].total) * 100).toFixed(1),
      C_pct: ((stats[q].C / stats[q].total) * 100).toFixed(1),
      D_pct: ((stats[q].D / stats[q].total) * 100).toFixed(1),
      avgDifficulty: skullIcon,
      hardAlert: stats[q].maxDiffCount > (stats[q].total / 2) // เตือนถ้าโหวตว่ายากเกินครึ่ง
    };
  }
  
  return ContentService.createTextOutput(JSON.stringify({ status: "success", data: result }))
    .setMimeType(ContentService.MimeType.JSON);
}
</script>
